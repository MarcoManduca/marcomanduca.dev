# Security headers, kept in parity with the CloudFront response headers
# policy (infra/terraform/modules/cdn/main.tf). Included at server level and
# in every location that sets its own add_header, because nginx drops
# inherited add_header directives as soon as a location declares one.
# HSTS is left to the TLS-terminating edge (CloudFront); this container
# serves plain HTTP.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
