# Security headers, kept in parity with the CloudFront response headers
# policy (infra/terraform/modules/cdn/headers.tf). Included at server level
# and in every location that sets its own add_header, because nginx drops
# inherited add_header directives as soon as a location declares one.
#
# Intentional differences from CloudFront:
#   - no HSTS: this container serves plain HTTP; the TLS edge sets it;
#   - connect-src allows any https origin: the Cognito and media origins
#     are only known per deployment (CloudFront lists them exactly).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
