<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D1B1F" />
    <script src="/theme-init.js"></script>
    <!-- seo:start -->
    <!--
      Generic defaults, used for routes that have no pre-rendered page (the
      build writes one per public route, see scripts/prerender, replacing
      everything between the seo markers). No canonical or og:url here: this
      shell is served for every path. `data-rh` hands the tags over to
      react-helmet-async, which replaces them with the per-page tags emitted
      by <Seo /> instead of duplicating them.
    -->
    <title>marcomanduca.dev</title>
    <meta
      data-rh="true"
      name="description"
      content="Marco Manduca — Data Engineer & Data Scientist. Portfolio, technical knowledge base and CV."
    />
    <meta data-rh="true" property="og:site_name" content="marcomanduca.dev" />
    <meta data-rh="true" property="og:title" content="marcomanduca.dev" />
    <meta
      data-rh="true"
      property="og:description"
      content="Marco Manduca — Data Engineer & Data Scientist. Portfolio, technical knowledge base and CV."
    />
    <meta data-rh="true" property="og:type" content="website" />
    <meta
      data-rh="true"
      property="og:image"
      content="https://marcomanduca.dev/og-image.png"
    />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" property="og:locale" content="en_GB" />
    <meta data-rh="true" property="og:locale:alternate" content="it_IT" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="marcomanduca.dev" />
    <meta
      data-rh="true"
      name="twitter:description"
      content="Marco Manduca — Data Engineer & Data Scientist. Portfolio, technical knowledge base and CV."
    />
    <meta
      data-rh="true"
      name="twitter:image"
      content="https://marcomanduca.dev/og-image.png"
    />
    <!-- seo:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
