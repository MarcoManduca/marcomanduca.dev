[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "marcomanduca-dev-backend"
version = "0.1.0"
description = "FastAPI backend for the marcomanduca.dev personal portfolio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "boto3>=1.43",
    "PyJWT[crypto]>=2.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "moto[dynamodb,s3,ses]>=5.2",
    "ruff>=0.16",
    "pip-audit>=2.10",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests: plain asserts are the pytest idiom, fake tokens are fixtures, and
# AAA test names document intent.
"tests/**" = ["S101", "S105", "S106", "D"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection relies on calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The seeder (`seed/`) is not part of the installed package: put the backend
# root on the path so its tests import it however pytest is launched.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: API-level tests run against the ASGI app",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
