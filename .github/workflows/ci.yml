# CI pipeline: lint -> tests -> coverage gate, per stack, in parallel.
#
#   backend   ruff (lint + format check), pytest with 80% coverage gate
#   frontend  eslint, type-check/build, vitest with coverage
#   terraform fmt check + validate (no AWS credentials needed)

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default token; jobs only need to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test with coverage gate
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint .

      - name: Type-check and build
        run: npm run build

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Dependency audit (npm audit)
        # Audit only runtime dependencies: dev tooling (vite, vitest, esbuild)
        # never ships in the static bundle, so its advisories must not gate CI.
        run: npm audit --omit=dev --audit-level=high

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
