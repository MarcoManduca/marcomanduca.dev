# CI pipeline: lint -> tests -> coverage gate, per stack, plus security scans,
# all jobs in parallel.
#
#   backend       ruff, pytest unit + integration (combined 80% coverage gate), pip-audit
#   frontend      eslint, type-check/build, vitest with coverage, npm audit
#   terraform     fmt check + validate (no backend, no AWS credentials)
#   gitleaks      secret scan over the full git history
#   hadolint      Dockerfile lint (backend + frontend)
#   trivy-iac     misconfiguration scan of infra/terraform
#   backend-image docker build of the backend image + trivy vulnerability scan
#
# Every action is pinned to a full commit SHA (tag in the trailing comment);
# Dependabot (.github/dependabot.yml) proposes the updates.
# No deploy automation here: deploys run manually via infra/scripts/*.sh.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default token; jobs only need to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      # Coverage is collected across both suites (--cov-append) and gated once
      # at the end, so the 80% threshold applies to the combined total.
      - name: Unit tests
        run: pytest tests/unit --cov=src --cov-report= --cov-fail-under=0

      - name: Integration tests + combined coverage gate
        run: >-
          pytest tests/integration --cov=src --cov-append
          --cov-report=term-missing --cov-fail-under=80

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint .

      - name: Type-check and build
        run: npm run build

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Dependency audit (npm audit)
        # Audit only runtime dependencies: dev tooling (vite, vitest, esbuild)
        # never ships in the static bundle, so its advisories must not gate CI.
        run: npm audit --omit=dev --audit-level=high

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [infra/terraform, infra/terraform/bootstrap]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # >= 1.10 is required by the S3 backend's native locking (use_lockfile).
          terraform_version: "1.10.5"

      - name: Format check
        run: terraform fmt -check -recursive

      # -backend=false: never touch the remote state from CI.
      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR commits to scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE needed: personal-account repository.

  hadolint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [backend/Dockerfile, frontend/Dockerfile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning
          # DL3025: the frontend HEALTHCHECK uses shell form on purpose
          # (it needs the `|| exit 1` shell fallback).
          ignore: DL3025

  trivy-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Accepted findings are suppressed inline (#trivy:ignore:...) next to
      # the resource, each with its justification.
      - name: Trivy IaC scan (terraform)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: CRITICAL,HIGH
          exit-code: "1"

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Native (amd64) build: same Dockerfile and packages as the arm64 image
      # deployed to Lambda, which is what matters for a vulnerability scan.
      - name: Build backend image
        run: docker build --tag backend:ci backend

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
