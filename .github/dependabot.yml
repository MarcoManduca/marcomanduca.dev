# Monthly dependency updates, one grouped PR per ecosystem.
#
# GitHub Actions are pinned to commit SHAs in ci.yml; Dependabot bumps the SHA
# and the "# vX.Y.Z" comment together. Action majors are included (deprecated
# runners otherwise break CI unnoticed); npm/pip majors are ignored and done by
# hand, since they need real migrations (e.g. Tailwind 4, @types/node tracks
# the Node runtime major).
#
# Docker base images are pinned by tag + digest; Dependabot bumps both. The
# backend stays on Python 3.12 (the Lambda target the lockfiles are resolved
# for), so only its patch releases are proposed. Stage images copied with
# `COPY --from=` (the Lambda Web Adapter) are not tracked: bump them by hand.
#
# The backend lockfiles (requirements*.lock, generated by `uv pip compile`)
# are not regenerated by Dependabot: the weekly CI run audits them with
# pip-audit, and backend/README.md has the regeneration commands.
#
# Security updates are separate: enable them in Settings → Code security.
# They are not grouped or delayed by this file.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # katex is only imported for its stylesheet; rehype-katex renders with
      # its own bundled KaTeX (0.16.x). Keep both on the same minor until
      # rehype-katex moves on, or math markup and CSS drift apart.
      - dependency-name: "katex"
        versions: [">=0.17.0"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    ignore:
      # Python minors change the runtime the lockfiles were resolved for.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend-images:
        patterns: ["*"]
    ignore:
      # Node majors move together with the CI node-version: bump by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # nginx odd minors (1.31, 1.33, …) are the mainline branch; the image
      # stays on stable (even minors), so only its patch releases are
      # proposed. Move to the next stable (1.32, each April) by hand.
      - dependency-name: "nginxinc/nginx-unprivileged"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform
      - /infra/terraform/bootstrap
    schedule:
      interval: monthly
    groups:
      terraform:
        patterns: ["*"]
