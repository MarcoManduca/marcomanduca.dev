# Local development stack.
#
#   docker compose up --build
#
# Services:
#   backend        FastAPI on http://localhost:8000 (docs at /docs)
#   frontend       production nginx build on http://localhost:5173
#   dynamodb-local in-memory DynamoDB on http://localhost:8001
#   dynamodb-init  one-shot: creates the 4 tables, then exits (the backend
#                  waits for it)
#
# The database is in memory, so it is empty after every restart: seed it
# again from backend/ with `python -m seed.seed --demo` (see backend/seed).
#
# Note: for day-to-day frontend work prefer the Vite dev server
# (`cd frontend && npm run dev`) — instant HMR instead of a full nginx
# rebuild. The frontend service here is for verifying the production build.

services:
  backend:
    build: ./backend
    # Loopback only, like DynamoDB Local: locally the API runs with docs on
    # and the origin check off, so it must not be reachable from the LAN.
    ports:
      - "127.0.0.1:8000:8000"
    # backend/.env is optional (gitignored): create it from backend/.env.example
    # for local overrides. Everything required for local runs is set below.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: local
      AWS_DEFAULT_REGION: eu-west-1
      # Dummy credentials: DynamoDB Local accepts anything, boto3 needs them set.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      # Must match the names the dynamodb-init service creates below.
      PROJECTS_TABLE_NAME: portfolio-projects
      LEARNING_TABLE_NAME: portfolio-learning
      TECHNOLOGIES_TABLE_NAME: portfolio-technologies
      RATELIMIT_TABLE_NAME: portfolio-ratelimit
    depends_on:
      dynamodb-local:
        condition: service_started
      # The in-memory database starts empty: create the tables first, so
      # `docker compose up backend` is enough to seed it.
      dynamodb-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      # Vite inlines these at build time. Set them in the shell or a root .env
      # (gitignored) to test admin login against Cognito; empty disables it.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_COGNITO_AUTHORITY: ${VITE_COGNITO_AUTHORITY:-}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID:-}
        VITE_COGNITO_REDIRECT_URI: ${VITE_COGNITO_REDIRECT_URI:-}
        VITE_COGNITO_DOMAIN: ${VITE_COGNITO_DOMAIN:-}
    ports:
      # nginx-unprivileged listens on 8080 (non-root); loopback only.
      - "127.0.0.1:5173:8080"
    depends_on:
      - backend

  dynamodb-local:
    # Tag + multi-arch index digest, like the Dockerfiles; Dependabot
    # (docker-compose ecosystem) bumps both.
    image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    # -inMemory: nothing is persisted, a fresh database on every start.
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "127.0.0.1:8001:8000"

  dynamodb-init:
    image: amazon/aws-cli:2.37.4@sha256:fdd8d1fcbea9c371678dee5a40df8b178c7a781b4586605756ee28114c97ead6
    entrypoint: ["bash", "/scripts/create-local-tables.sh"]
    environment:
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      # Keep these in sync with the backend service above.
      PROJECTS_TABLE_NAME: portfolio-projects
      LEARNING_TABLE_NAME: portfolio-learning
      TECHNOLOGIES_TABLE_NAME: portfolio-technologies
      RATELIMIT_TABLE_NAME: portfolio-ratelimit
    volumes:
      - ./infra/scripts:/scripts:ro
    depends_on:
      - dynamodb-local
